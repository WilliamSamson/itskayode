<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Deep Cosmic Black Canvas -->
  <rect x="2" y="2" width="508" height="508" rx="112" fill="#06070a" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2.5"/>

  <!-- Telemetry Calibration Horizon -->
  <g id="astrometric-grid" opacity="0.38">
    <circle cx="256" cy="256" r="210" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 12"/>
    <!-- Horizon Crosshair Calipers -->
    <line x1="256" y1="36" x2="256" y2="56" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="456" x2="256" y2="476" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="256" x2="56" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="456" y1="256" x2="476" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Technical Caliper Arc Ring (Horizon Style Caliper Segments) -->
  <g id="caliper-arcs">
    <!-- Outer segmented heavy caliper arcs -->
    <path d="M 124 124 A 186 186 0 0 1 388 124" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M 388 388 A 186 186 0 0 1 124 388" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Fine dashed telemetry track -->
    <circle cx="256" cy="256" r="158" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.5"/>
    
    <!-- Radiating Telemetry Ray Ticks (Horizon style side brackets) -->
    <line x1="72" y1="220" x2="88" y2="224" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="68" y1="240" x2="86" y2="242" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="68" y1="272" x2="86" y2="270" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="72" y1="292" x2="88" y2="288" stroke="#ffffff" stroke-width="2.5"/>

    <line x1="440" y1="220" x2="424" y2="224" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="444" y1="240" x2="426" y2="242" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="444" y1="272" x2="426" y2="270" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="440" y1="292" x2="424" y2="288" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Orbital Companion Node (Solar Core) -->
    <circle cx="396" cy="188" r="12" fill="#ffffff"/>
    <circle cx="396" cy="188" r="20" stroke="#ffb21a" stroke-width="3"/>
  </g>

  <!-- The Architectural Floating Island Monolith -->
  <g id="island-monolith">
    <!-- Upper Cantilevered Architectural Plateau -->
    <polygon points="148,206 364,206 340,224 172,224" fill="#ffffff"/>
    
    <!-- Central Observation Horizon Slot -->
    <line x1="172" y1="224" x2="340" y2="224" stroke="#06070a" stroke-width="4"/>

    <!-- Inverted Geological Keel - Left Wing -->
    <polygon points="172,228 252,228 252,348 214,296" fill="#cbd5e1"/>
    
    <!-- Inverted Geological Keel - Right Wing -->
    <polygon points="260,228 340,228 298,296 260,348" fill="#ffffff"/>
    
    <!-- Plunging Stalactite Core Spire -->
    <polygon points="252,348 260,348 256,376" fill="#ffffff"/>
  </g>
</svg>
